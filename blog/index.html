<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블로그 — Pixkit | 이미지 최적화 가이드</title>
    <meta name="description" content="이미지 포맷 가이드, SNS 사이즈 정보, 최적화 팁, 튜토리얼 등 유용한 이미지 관련 정보를 제공합니다.">
    <link rel="canonical" href="https://pickit.pics/blog/">
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .blog-hero {
            text-align: center;
            padding: 48px 20px 32px;
        }

        .blog-hero h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .blog-hero p {
            color: #64748b;
        }

        .cat-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .cat-tab {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            background: #fff;
            cursor: pointer;
            font-size: .88rem;
            font-weight: 500;
            color: #64748b;
            transition: .15s;
            text-decoration: none;
        }

        .cat-tab:hover,
        .cat-tab.active {
            background: #6366f1;
            color: #fff;
            border-color: #6366f1;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .blog-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
            transition: .2s;
        }

        .blog-card:hover {
            box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
            transform: translateY(-2px);
        }

        .blog-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .blog-card .card-body {
            padding: 20px;
        }

        .blog-card .card-cat {
            font-size: .75rem;
            color: #6366f1;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .blog-card h3 {
            font-size: 1.05rem;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .blog-card h3 a {
            text-decoration: none;
            color: #0f172a;
        }

        .blog-card h3 a:hover {
            color: #6366f1;
        }

        .blog-card .card-date {
            font-size: .8rem;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="lang-bar">
        <div class="container" id="langSelector"></div>
    </div>

    <header class="header">
        <div class="container">
            <a href="/" class="logo">🖼️ Pixkit</a>
            <nav>
                <a href="/">툴</a>
                <a href="/blog/" class="active">블로그</a>
                <a href="/about/">소개</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="blog-hero">
            <h1>블로그</h1>
            <p>이미지 최적화와 관련된 유용한 팁과 가이드</p>
        </section>

        <div class="container">
            <div class="cat-tabs">
                <a class="cat-tab active" href="/blog/">전체</a>
                <a class="cat-tab" href="/blog/?cat=format">포맷가이드</a>
                <a class="cat-tab" href="/blog/?cat=size">사이즈정보</a>
                <a class="cat-tab" href="/blog/?cat=optimize">최적화</a>
                <a class="cat-tab" href="/blog/?cat=tutorial">튜토리얼</a>
            </div>

            <div class="blog-grid">
                <article class="blog-card">
                    <img src="/images/blog/jpg-vs-png.jpg" alt="JPG vs PNG vs WebP 비교">
                    <div class="card-body">
                        <div class="card-cat">포맷가이드</div>
                        <h3><a href="/blog/jpg-vs-png-vs-webp/">JPG vs PNG vs WebP — 어떤 포맷을 써야 할까?</a></h3>
                        <div class="card-date">2025년 1월 15일</div>
                    </div>
                </article>

                <article class="blog-card">
                    <img src="/images/blog/heic-guide.jpg" alt="HEIC 파일 가이드">
                    <div class="card-body">
                        <div class="card-cat">포맷가이드</div>
                        <h3><a href="/blog/heic-guide/">HEIC 파일이란? 아이폰 사진 포맷 완벽 가이드</a></h3>
                        <div class="card-date">2025년 1월 14일</div>
                    </div>
                </article>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p data-i18n="rights">© 2026 Pixkit.</p>
            <p><a href="/privacy/">개인정보처리방침</a> · <a href="/terms/">이용약관</a></p>
        </div>
    </footer>

    <script src="/js/i18n.js"></script>
</body>

</html>
