<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#f59e0b"/>
          <text x="16" y="23" text-anchor="middle" font-size="20" font-weight="800" fill="#0a0f1e" font-family="system-ui">P</text>
        </svg>
        <span class="logo-text">Pixkit</span>
      </div>
      <p class="subtitle">이미지 우클릭으로 바로 편집</p>
    </header>

    <div class="cards">
      <button class="card" data-tool="remove-bg">
        <div class="card-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 4V2m0 2v2m0-2h-4.5M3 10v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-9M3 10l2.96-5.17A2 2 0 0 1 7.69 3.5h8.62a2 2 0 0 1 1.73 1.33L21 10M3 10h18"/>
            <circle cx="12" cy="16" r="3"/>
          </svg>
        </div>
        <div class="card-text">
          <span class="card-title">배경 제거</span>
          <span class="card-sub">AI 누끼 따기 &middot; 하루 3회</span>
        </div>
      </button>

      <button class="card" data-tool="resize">
        <div class="card-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </div>
        <div class="card-text">
          <span class="card-title">리사이즈</span>
          <span class="card-sub">크기 변경 &middot; 무제한</span>
        </div>
      </button>

      <button class="card" data-tool="compress">
        <div class="card-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </div>
        <div class="card-text">
          <span class="card-title">이미지 압축</span>
          <span class="card-sub">용량 줄이기 &middot; 무제한</span>
        </div>
      </button>
    </div>

    <footer class="footer">
      <a href="#" class="footer-link" id="footerLink">더 많은 기능 → pixkit.app</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
